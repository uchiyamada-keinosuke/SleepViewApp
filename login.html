<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン ・ 睡眠×環境ビューア</title>
<style>
  :root{--bg:#0e1621;--panel:#161f2c;--grid:#243040;--ink:#e8eef6;--muted:#8ea0b4;--acc:#ff9d5c}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;padding:20px}
  .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--grid);
    border-radius:18px;padding:26px 22px}
  h1{font-size:17px;margin:0 0 3px}
  p.sub{font-size:12px;color:var(--muted);margin:0 0 20px}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  input{width:100%;background:#0e1621;border:1px solid var(--grid);border-radius:10px;
    color:var(--ink);padding:12px 13px;font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:16px;background:var(--acc);color:#1a1204;border:0;
    border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
  .err{color:#fb7185;font-size:12px;margin-top:12px;display:none}
  .err.show{display:block}
</style>
</head>
<body>
  <form class="box" method="POST" action="/api/login">
    <h1>睡眠 × 室温・湿度ビューア</h1>
    <p class="sub">パスワードを入力してください</p>
    <label for="pw">パスワード</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">ログイン</button>
    <div id="err" class="err">パスワードが違います。</div>
  </form>
<script>
  if (new URLSearchParams(location.search).get("e")) {
    document.getElementById("err").classList.add("show");
  }
</script>
</body>
</html>
